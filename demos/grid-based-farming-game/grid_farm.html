<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Grid-Based Farming Game</title><style>body,html{margin:0;height:100%;background:#18241f;color:#eee;font:16px system-ui}body{display:flex;flex-direction:column}header{padding:10px 16px}#game{flex:1;min-height:520px;min-width:360px;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:0}canvas:focus-visible{outline:2px solid #f1c462;outline-offset:-2px}</style></head><body><header id=status role=status>Loading…</header><div id=game><canvas aria-label="Farming game. Click to focus, then use W A S D to move."id=canvas oncontextmenu=event.preventDefault() tabindex=0></canvas></div><script>const canvas=document.getElementById("canvas");canvas.addEventListener("pointerdown",(()=>canvas.focus()));var Module={canvas:canvas,printErr:t=>console.error(t),onRuntimeInitialized:()=>{document.getElementById("status").textContent="Click the game, then use WASD to move."},onAbort:()=>{document.getElementById("status").textContent="Game could not start. Check WebGL support and the browser console."}}</script><script async src=grid_farm.js></script></body></html>
